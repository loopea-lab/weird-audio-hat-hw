# Board constants — the only source. Regenerate the module with
#   python3 test/gen_constants.py --write
#
# `source` says where each value comes from:
#   netlist        the schematic
#   copper         the production netlist / gerbers
#   bom            a part on the board; the value matches its designator
#   datasheet      a datasheet in datasheets/
#   design_target  a choice, not a measurement
#   derived        computed from other entries here
#
# Measured figures are not here: they vary per batch.

_module_name: audio_hat_constants
_module_doc: >-
  Audio HAT (WM8960) constants. Generated from constants.yaml, do not edit by hand.

board:
  BOARD_NAME:
    value: Audio HAT (WM8960)
    source: design_target
  BOARD_REV:
    value: R1.1
    source: copper
    note: as printed on F.SilkS, 'WEIRD AUDIO HAT R1.1'

codec:
  I2C_ADDR:
    value: 0x1a
    format: hex
    source: netlist
    note: WM8960 on i2c-1
  ALSA_CARD_NAME:
    value: wm8960soundcard
    source: design_target
    note: the name the driver enumerates as in `aplay -l`

clock:
  MCLK_HZ:
    value: 11289600
    unit: Hz
    source: design_target
    note: >-
      SYSCLK for the 44.1 kHz family, no PLL. minimal_clk generates it on GPCLK0; the
      board has no oscillator.
  MCLK_GPIO_BCM:
    value: 4
    source: netlist
    note: J3 pin 7 = BCM4 = GPCLK0 -> R26 -> U1 pin 11 (MCLK)
  PI_MODELS:
    value: [Pi 1, Pi Zero, Pi 2, Pi 3, Zero 2 W]
    source: design_target
    note: >-
      32-bit OS only; tested on the Zero 2 W. minimal_clk knows only the BCM2835 and
      BCM2836/7 register bases, so not the Pi 4 (BCM2711) nor the Pi 5 (RP1).
  SUPPORTED_ARCH:
    value: [armv6l, armv7l]
    source: design_target
    note: minimal_clk picks the register base from "model name" in /proc/cpuinfo, absent on 64-bit

capture:
  SAMPLE_FORMAT:
    value: S32_LE
    source: design_target
    note: the format for arecord / aplay. Not S24_3LE, not `-f cd`.
  SAMPLE_RATE_HZ:
    value: 44100
    unit: Hz
    source: derived
    note: >-
      The 44.1 kHz family that MCLK_HZ allows. 48 kHz needs a 12.288 MHz clock and a
      device-tree change.
  CHANNELS:
    value: 2
    source: netlist

jacks:
  JACKS:
    value:
      J5: {dir: in, channel: L, pin: LINPUT3, label: IN L}
      J1: {dir: in, channel: R, pin: RINPUT3, label: IN R}
      J4: {dir: out, channel: LR, pin: HP_L/HP_R, label: OUT L/R}
      J2: {dir: out, channel: mono, pin: OUT3, label: OUT MONO}
    source: netlist
    note: >-
      `label` is what is printed next to each jack; the J designators are not on the board.
      Inputs are single-ended (LINPUT1/2 and RINPUT1/2 unconnected), so no differential mode.
  MICBIAS_SWITCH_LABEL:
    value: MIC-R BIAS
    source: copper
    note: printed next to SW1, which puts MICBIAS on the IN R jack

loopback:
  LOOPBACK_NO_SIGNAL:
    value: NO SIGNAL
    source: design_target
    note: audio_loopback.py prints it; stack_test.py looks for it
  LOOPBACK_CROSSED:
    value: CROSSED
    source: design_target
    note: audio_loopback.py prints it; stack_test.py looks for it
  LOOPBACK_SEPARATION:
    value: separation
    source: design_target
    note: audio_loopback.py prints '<this> N dB'; stack_test.py reads N from it

micbias:
  MICBIAS_V:
    value: 2.97
    unit: V
    source: derived
    note: 0.9 × AVDD (3.3 V), datasheet WM8960
  MICBIAS_TOLERANCE:
    value: 0.05
    source: datasheet
    note: ±5 %, so 2.82–3.12 V

measurement:
  TONE_HZ:
    value: 1000
    unit: Hz
    source: design_target
    note: test tone for every loopback and output check
  TONE_AMPLITUDE:
    value: 0.3
    source: design_target
    note: fraction of full scale, well below clipping
  FLOOR_DB:
    value: -60.0
    unit: dBFS
    source: design_target
    note: below this there is only noise, not signal
  CROSSTALK_MARGIN_DB:
    value: 20.0
    unit: dB
    source: design_target
    note: the other channel this much louder means crossed; within it means mixed
  NEAR_CLIP_DB:
    value: -3.0
    unit: dBFS
    source: design_target
    note: an RMS level above this is a warning to lower the gain
  CLIP_DB:
    value: -0.5
    unit: dBFS
    source: design_target
    note: a peak this close to full scale is clipping
  QUIET_DB:
    value: -40.0
    unit: dBFS
    source: design_target
    note: above the floor but too low to call a working mic
  IN_CONTROLS:
    value: {L: IN L Capture Volume, R: IN R Capture Volume}
    source: design_target
    note: >-
      Mixer control per input: 0 mute, 1-7 line path −12…+6 dB, 8-9 PGA + boost (+13 / +22 dB
      net). The driver picks the path.
  IN_GAIN_DEFAULT:
    value: 4
    source: design_target
    note: >-
      `IN L/R Capture Volume` at boot (−3 dB, line path). Must match WM8960_IN_DEFAULT in the
      driver and the saved mixer state.
  MONITOR_GAIN_DB:
    value: -12.0
    unit: dB
    source: design_target
    note: bench loopback gain; the monitored input never leaves louder than -12 dBFS
