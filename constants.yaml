# Board constants — the only source. Regenerate the module with
#   python3 test/gen_constants.py --write
#
# `source` says where each value comes from:
#   netlist        the schematic
#   copper         the production netlist / gerbers
#   bom            a part on the board; the value matches its designator
#   datasheet      a datasheet in datasheets/
#   design_target  a choice, not a measurement
#   derived        computed from other entries here
#
# Measured figures are not here: they vary per batch.

_module_name: audio_hat_constants
_module_doc: >-
  Audio HAT (WM8960) constants. Generated from constants.yaml, do not edit by hand.

board:
  BOARD_NAME:
    value: Audio HAT (WM8960)
    source: design_target
  BOARD_REV:
    value: R1.1
    source: copper
    note: as printed on F.SilkS, 'WEIRD AUDIO HAT R1.1'

codec:
  I2C_ADDR:
    value: 0x1a
    format: hex
    source: netlist
    note: WM8960 on i2c-1
  ALSA_CARD_NAME:
    value: wm8960soundcard
    source: design_target
    note: the name the driver enumerates as in `aplay -l`

clock:
  MCLK_HZ:
    value: 11289600
    unit: Hz
    source: design_target
    note: >-
      SYSCLK for the 44.1 kHz family, no PLL. minimal_clk generates it on GPCLK0; the
      board has no oscillator.
  MCLK_GPIO_BCM:
    value: 4
    source: netlist
    note: J3 pin 7 = BCM4 = GPCLK0 -> R26 -> U1 pin 11 (MCLK)
  PI_MODELOS_SOPORTADOS:
    value: [Pi 1, Pi 2, Pi 3, Pi 4, Zero 2 W]
    source: design_target
    note: >-
      Not the Pi 5: minimal_clk writes BCM283x clock registers that the RP1 does not
      have, and there is no onboard oscillator.

capture:
  SAMPLE_FORMAT:
    value: S32_LE
    source: design_target
    note: the format for arecord / aplay. Not S24_3LE, not `-f cd`.
  SAMPLE_RATE_HZ:
    value: 44100
    unit: Hz
    source: derived
    note: >-
      The 44.1 kHz family that MCLK_HZ allows. 48 kHz needs a 12.288 MHz clock and a
      device-tree change.
  CHANNELS:
    value: 2
    source: netlist

jacks:
  JACKS:
    value:
      J5: {dir: in, channel: L, pin: LINPUT3}
      J1: {dir: in, channel: R, pin: RINPUT3}
      J4: {dir: out, channel: LR, pin: HP_L/HP_R}
      J2: {dir: out, channel: mono, pin: OUT3}
    source: netlist
    note: >-
      Inputs are single-ended (LINPUT1/2 and RINPUT1/2 unconnected), so differential
      mode is not possible. J1 is the only one with MICBIAS, switched by SW1.

loopback:
  LOOPBACK_NO_SIGNAL:
    value: NO SIGNAL
    source: design_target
    note: audio_loopback.py prints it; stack_test.py looks for it
  LOOPBACK_CROSSED:
    value: CROSSED
    source: design_target
    note: audio_loopback.py prints it; stack_test.py looks for it
  LOOPBACK_SEPARATION:
    value: separation
    source: design_target
    note: audio_loopback.py prints '<this> N dB'; stack_test.py reads N from it
